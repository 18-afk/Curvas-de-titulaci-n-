<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Curvas de titulación</title>
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#14233C; --muted:#586A84; --line:#D3DCE8;
  --grid:#C6D3E5; --grid-minor:#E4EBF4; --curve:#1D4ED8; --accent:#D6336C; --teal:#0E8F7E; --focus:#1D4ED8;
  --tab:#2E75B6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1626; --surface:#15213A; --surface2:#1A2845; --ink:#E6ECF5; --muted:#9AAAC2; --line:#2B3B59;
    --grid:#2D3F60; --grid-minor:#1E2D49; --curve:#6EA0FF; --accent:#FF6B9A; --teal:#3DD6BF; --focus:#8DB4FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1626; --surface:#15213A; --surface2:#1A2845; --ink:#E6ECF5; --muted:#9AAAC2; --line:#2B3B59;
  --grid:#2D3F60; --grid-minor:#1E2D49; --curve:#6EA0FF; --accent:#FF6B9A; --teal:#3DD6BF; --focus:#8DB4FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); min-height:100%;
  font-family:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums}
.app{max-width:1220px; margin:0 auto; padding:20px 16px 48px}
h1{font-size:24px; line-height:1.15; margin:0 0 4px; letter-spacing:-.01em}
.sub{margin:0 0 16px; color:var(--muted); max-width:62ch}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:6px}

.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:16px; scrollbar-width:thin}
.tab{flex:0 0 auto; appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font:inherit; font-weight:600; padding:9px 14px; border-radius:10px; cursor:pointer; border-bottom:4px solid var(--line)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--tab)}

.layout{display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
.controls{position:sticky; top:12px}
.controls h2,.explorer h2{font-size:15px; margin:0 0 12px}
.field{margin-bottom:12px}
.field label{display:block; font-size:13px; font-weight:600; margin-bottom:4px}
.field .hint{font-weight:400; color:var(--muted)}
.inp{display:flex; align-items:center; border:1px solid var(--line); background:var(--surface2); border-radius:8px}
.inp:focus-within{border-color:var(--focus); box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 30%,transparent)}
.inp input,.inp select,.field select,textarea{font:inherit; font-size:16px; color:var(--ink); background:transparent; border:0; padding:8px 10px; width:100%; min-width:0; outline:none}
.inp .unit{padding:0 10px 0 0; color:var(--muted); font-size:13px; white-space:nowrap}
.field select{border:1px solid var(--line); background:var(--surface2); border-radius:8px}
details.adv{margin-top:6px; border-top:1px solid var(--line); padding-top:10px}

.results{display:grid; gap:14px; min-width:0}

.info span{font-size:18px; font-weight:700}
.plotcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 12px 10px}
.plot{position:relative; touch-action:pan-y; cursor:crosshair; user-select:none; -webkit-user-select:none}
.plot svg{display:block}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12.5px; padding:5px 8px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-130%); z-index:2}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:6px; font-size:13px; color:var(--muted)}
.legend i{display:inline-block; width:18px; height:0; border-top:3px solid; vertical-align:middle; margin-right:6px}
.plotbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--muted)}
.plotbar select{font:inherit; font-size:13px; padding:3px 6px; border-radius:6px; border:1px solid var(--line); background:var(--surface2); color:var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:8px}

.steps{margin:8px 0 0; padding-left:20px}
.steps li{margin:4px 0}
.result{margin-top:10px; font-size:20px; font-weight:700}
.result span{color:var(--accent)}

details.tablebox{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
details.tablebox summary{cursor:pointer; font-weight:600}

table{border-collapse:collapse; width:100%; font-size:13px}

td:nth-child(n){font-variant-numeric:tabular-nums}
td.l{text-align:left}
tr.keyrow td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
textarea{border:1px solid var(--line); background:var(--surface2); border-radius:8px; width:100%; min-height:260px; resize:vertical; font-family:inherit}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.charts3{display:grid; gap:14px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:14px; z-index:10}

svg text{font-family:inherit}
.ax text{fill:var(--muted); font-size:11px}
.axt{fill:var(--ink); font-size:12px; font-weight:600}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}

<body>
<div class="app">
  <div class="kicker">Simulador de química analítica</div>
  <h1>Curvas de titulación</h1>
  <p class="sub">Elige el método, cambia los datos y toca o arrastra sobre la gráfica: abajo verás el procedimiento completo de ese punto.</p>
  <nav class="seg" id="mainnav" role="tablist" aria-label="Sección"></nav>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Método"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
//#MATH-START
const LOG = Math.log10;
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function fN(x,d){ if(d===undefined) d=2; return (x==null||!Number.isFinite(x))?'—':x.toFixed(d).replace('-','−'); }
function fE(x){ if(!Number.isFinite(x)) return '—'; if(x===0) return '0'; const parts=x.toExponential(2).split('e'); const n=parseInt(parts[1],10);
  const s=String(Math.abs(n)).replace(/\d/g,d=>SUP[d]); return parts[0].replace('-','−')+'×10'+(n<0?'⁻':'')+s; }
function fv(x){ if(!Number.isFinite(x)) return '—'; const a=Math.abs(x); if(a===0) return '0'; if(a>=0.001&&a<1000) return String(+x.toPrecision(4)).replace('-','−'); return fE(x); }
function zoneOf(V,Veq){ return Math.abs(V)<1e-9?0:(Math.abs(V-Veq)<1e-6?2:(V<Veq?1:3)); }

/* ---------- Ácido-base ---------- */
const AB = {
  key:'ab', tab:'Ácido-base', color:'#2E75B6', ylabel:'pH', ymin:0, ymax:14, ytitle:'pH',
  defaults:{tipo:3,Ca:0.1,Va:10,Ct:0.1,pK:4.76,pKw:14,model:1},
  fields(p){
    const f=[{k:'tipo',type:'select',label:'Tipo de titulación',opts:[[1,'Ácido fuerte con base fuerte'],[2,'Base fuerte con ácido fuerte'],[3,'Ácido débil con base fuerte'],[4,'Base débil con ácido fuerte']]}];
    if(p.tipo===3) f.push({type:'preset',label:'Ácido de ejemplo',opts:[['Ácido acético',{pK:4.76,sp:{HA:'CH₃COOH',A:'CH₃COO⁻'}}],['Ácido fórmico',{pK:3.75,sp:{HA:'HCOOH',A:'HCOO⁻'}}],['Ácido benzoico',{pK:4.20,sp:{HA:'C₆H₅COOH',A:'C₆H₅COO⁻'}}],['Ácido fluorhídrico',{pK:3.17,sp:{HA:'HF',A:'F⁻'}}],['Ácido láctico',{pK:3.86,sp:{HA:'CH₃CH(OH)COOH',A:'CH₃CH(OH)COO⁻'}}],['Ácido nitroso',{pK:3.35,sp:{HA:'HNO₂',A:'NO₂⁻'}}],['Ácido hipocloroso',{pK:7.54,sp:{HA:'HClO',A:'ClO⁻'}}]]});
    if(p.tipo===4) f.push({type:'preset',label:'Base de ejemplo',opts:[['Amoniaco',{pK:4.75,sp:{HA:'NH₃',A:'NH₄⁺'}}],['Metilamina',{pK:3.36,sp:{HA:'CH₃NH₂',A:'CH₃NH₃⁺'}}],['Piridina',{pK:8.75,sp:{HA:'C₅H₅N',A:'C₅H₅NH⁺'}}]]});
    const names={1:'Concentración del ácido',2:'Concentración de la base',3:'Concentración del ácido débil',4:'Concentración de la base débil'};
    f.push({k:'Ca',label:names[p.tipo],unit:'mol/L'});
    f.push({k:'Va',label:'Volumen de la alícuota',unit:'mL'});
    f.push({k:'Ct',label:(p.tipo===1||p.tipo===3)?'Concentración del titulante (base)':'Concentración del titulante (ácido)',unit:'mol/L'});
    if(p.tipo>=3) f.push({k:'pK',label:p.tipo===3?'pKa del ácido':'pKb de la base',unit:''});
    f.push({k:'pKw',label:'pKw',hint:'(14 a 25 °C)',unit:''});
    f.push({k:'model',type:'select',label:'Modelo de cálculo',opts:[[1,'Aproximado (por zonas)'],[2,'Exacto (balance de carga)']]});
    return f;
  },

function parseData(text){
  const out=[]; text.split(/\r?\n/).forEach(line=>{ const t=line.trim(); if(!t) return;
    let parts=t.split(/[\t; ]+/); if(parts.length<2 && t.indexOf(',')>=0) parts=t.split(',');
    const a=parseFloat(String(parts[0]).replace(',','.')), b=parseFloat(String(parts[1]).replace(',','.'));
    if(Number.isFinite(a)&&Number.isFinite(b)) out.push([a,b]); });
  out.sort((x,y)=>x[0]-y[0]);
  return out.filter((r,i)=>i===0||r[0]>out[i-1][0]);
}
function derivs(pts){
  const n=pts.length; const m1=[]; for(let i=0;i<n-1;i++){ const dv=pts[i+1][0]-pts[i][0]; m1.push({x:(pts[i][0]+pts[i+1][0])/2,d:(pts[i+1][1]-pts[i][1])/dv}); }
  const m2=[]; for(let i=0;i<m1.length-1;i++) m2.push({x:(m1[i].x+m1[i+1].x)/2,d2:(m1[i+1].d-m1[i].d)/(m1[i+1].x-m1[i].x)});
  let i1=-1,best=-1; m1.forEach((r,i)=>{ if(Math.abs(r.d)>best){best=Math.abs(r.d); i1=i;} });
  const veq1=i1>=0?m1[i1].x:null; const cross=[];
  for(let i=0;i<m2.length-1;i++){ const a=m2[i],b=m2[i+1]; if(a.d2*b.d2<=0 && b.d2!==a.d2) cross.push(a.x-a.d2*(b.x-a.x)/(b.d2-a.d2)); }
  let veq2=null; if(veq1!=null && cross.length){ veq2=cross.reduce((u,v)=>Math.abs(v-veq1)<Math.abs(u-veq1)?v:u); }
  return {m1,m2,i1,veq1,veq2};
}
function simpH(V){ const Ca=0.1,Va=10,Ct=0.1,Ka=Math.pow(10,-4.76),Kw=1e-14; const A=Ca*Va/(Va+V), Na=Ct*V/(Va+V); let lo=-14,hi=0;
  for(let i=0;i<200;i++){ const mid=(lo+hi)/2,h=Math.pow(10,mid); const g=Na+h-Kw/h-A*Ka/(Ka+h); if(g>0) hi=mid; else lo=mid; }
  return Math.round(-(lo+hi)/2*100)/100; }

function niceTicks(min,max,n){ const span=max-min; const raw=span/n; const mag=Math.pow(10,Math.floor(Math.log10(raw))); const norm=raw/mag;
  const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag; const start=Math.ceil(min/step-1e-9)*step; const t=[];
  for(let v=start;v<=max+step*1e-9;v+=step) t.push(+v.toFixed(10)); return {ticks:t,step}; }
let plotId=0; const plots=[];
function makePlot(container){ container.classList.add('plot'); container.innerHTML='<div class="svgbox"></div><div class="tip" hidden></div>'; container._id=++plotId; plots.push(container);

  container.addEventListener('pointermove',e=>{ const g=container._geom,cfg=container._cfg; if(!g) return; const x=toData(e);
    if(container._drag && cfg.onPick && x!=null) cfg.onPick(Math.min(g.xmax,Math.max(g.xmin,x)));
    if(x==null||x<g.xmin||x>g.xmax){ tip.hidden=true; return; }
    const s=cfg.series[0]; let best=null,bd=Infinity; s.pts.forEach(p=>{ if(p.y==null) return; const d=Math.abs(p.x-x); if(d<bd){bd=d;best=p;} });
    if(!best){ tip.hidden=true; return; }

  container.addEventListener('pointerleave',()=>{ tip.hidden=true; });

    const g=container._geom, x=toData(e); if(x!=null) cfg.onPick(Math.min(g.xmax,Math.max(g.xmin,x))); });

function sampleCalc(m,p,c,xmax,N){ const Vs=[]; for(let k=0;k<=N;k++) Vs.push(k*xmax/N); if(c.Veq<=xmax&&!Vs.some(v=>Math.abs(v-c.Veq)<1e-9)) Vs.push(c.Veq); Vs.sort((a,b)=>a-b); return Vs.map(V=>m.calc(p,c,V)); }
function cell(col,r){ const v=col.v(r); if(col.d==='s') return {t:String(v),l:true}; if(v==null) return {t:'n.d.'}; return {t:col.d==='e'?fE(v):fN(v,col.d)}; }
function renderResults(){

  const c=m.prep(p); const xmax=state.cfg.vmax>0?state.cfg.vmax:state.xf[m.key]*c.Veq;

  let V=state.V[m.key]; if(V==null||V>xmax) V=c.Veq/2; V=Math.max(0,V);
  const here=m.calc(p,c,V);
  const series=[{pts:pts.map(r=>({x:r.V,y:r.y,r})),color:'var(--curve)'}]; let legend='<span><i style="border-color:var(--curve)"></i>'+esc(m.ylabel==='E'?'E vs referencia':m.ylabel==='pX'?'pX':m.ylabel)+'</span>';
  if(m.key==='pp'){ series.push({pts:pts.map(r=>({x:r.V,y:r.y2})),color:'var(--teal)',dash:true}); legend+='<span><i style="border-color:var(--teal);border-top-style:dashed"></i>pAg</span>'; }
  const EQS=c.eqs||[c.Veq], marks=EQS.map(v=>({x:v,y:m.calc(p,c,v).y}));
  legend+='<span style="color:var(--accent)">◆ '+(EQS.length>1?'Puntos de equivalencia ('+EQS.map(v=>fN(v,2)).join(' · ')+' mL)':'Punto de equivalencia ('+fN(c.Veq,2)+' mL)')+'</span>';
  if(c.halves){ c.halves.forEach(v=>{ if(v<=xmax) marks.push({x:v,y:m.calc(p,c,v).y,color:'var(--teal)'}); }); legend+='<span style="color:var(--teal)">◆ Semi-equivalencia (pH ≈ pKa)</span>'; }
  $('#legend').innerHTML=legend;
  const unit=m.key==='rx'?' V':''; const xl=m.key==='edta'?'Volumen de EDTA (mL)':m.key==='pp'?'Volumen de AgNO₃ (mL)':'Volumen de titulante (mL)';
  setPlot(cur.plot,{series,xlabel:xl,ylabel:m.ytitle,xmin:0,xmax,ymin:m.ymin,ymax:m.ymax,label:'Curva de titulación '+m.tab,
    marks,cursor:{x:V,y:here.y},
    tip:q=>'V = '+fN(q.x,2)+' mL · '+m.resLabel+' = '+fN(q.y,m.key==='rx'?3:2)+unit,
    onPick:x=>{ state.V[m.key]=Math.round(x*100)/100; renderResults(); }});
  // chips
  const chips=$('#chips'); chips.innerHTML=''; m.keys(c).forEach(k=>{ const r=m.calc(p,c,k[1]); const b=el('button',{class:'chip',type:'button','aria-pressed':String(Math.abs(k[1]-V)<1e-6)},'<small>'+esc(k[0])+' · '+fN(k[1],2)+' mL</small><strong>'+esc(m.resLabel)+' = '+(r.y==null?'n.d.':fN(r.y,m.key==='rx'?3:2))+'</strong>');
    b.addEventListener('click',()=>{ state.V[m.key]=k[1]; renderResults(); }); chips.appendChild(b); });
  // explorador
  const ex=$('#explorer'); const step=Math.max(xmax/400,0.001);
  ex.innerHTML='<h2>Procedimiento a un volumen dado</h2><div class="row"><div class="inp vin"><input id="vnum" type="number" step="any" inputmode="decimal" aria-label="Volumen de titulante en mL"><span class="unit">mL</span></div><input id="vrange" type="range" min="0" max="'+xmax+'" step="'+step+'" aria-label="Volumen de titulante"><span class="badge">'+esc(here.zoneName)+'</span></div>'+
    '<div><b>Ecuación aplicada en este punto:</b> '+esc(here.eq)+'</div><ol class="steps">'+here.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+
    (here.y==null?'':'<div class="result">'+esc(m.resLabel)+' = <span>'+fN(here.y,m.key==='rx'?3:2)+(m.key==='rx'?' V':'')+'</span></div>');
  const vn=$('#vnum'); vn.value=String(+V.toFixed(3)); $('#vrange').value=V;
  $('#vrange').addEventListener('input',e=>{ state.V[m.key]=parseFloat(e.target.value); renderResults(); });
  vn.addEventListener('change',()=>{ const x=parseFloat(vn.value); if(Number.isFinite(x)){ state.V[m.key]=Math.min(xmax,Math.max(0,x)); renderResults(); } });
  // tabla
  const rows=pts; $('#tblsum').textContent='Tabla de titulación ('+rows.length+' puntos, ΔV = '+fv(Math.min(5,Math.max(.05,state.cfg.dv)))+' mL)'; cur.p=p; cur.c=c; renderRxn(m,p,c);
  let h='<thead><tr>'+m.cols.map(cl=>'<th>'+esc(cl.h)+'</th>').join('')+'</tr></thead><tbody>'; let tsv=m.cols.map(cl=>cl.h).join('\t')+'\n';
  rows.forEach(r=>{ h+='<tr'+(r.z===2?' class="keyrow"':'')+'>'+m.cols.map(cl=>{ const x=cell(cl,r); return '<td'+(x.l?' class="l"':'')+'>'+esc(x.t)+'</td>'; }).join('')+'</tr>';
    tsv+=m.cols.map(cl=>{ const v=cl.v(r); return cl.d==='s'?v:(v==null?'':String(+Number(v).toPrecision(8))); }).join('\t')+'\n'; });
  $('#tbl').innerHTML=h+'</tbody>'; cur.tsv=tsv;
}

/* ---- configuración de la titulación (ΔV, volumen máximo) ---- */
function sampleCalc2(m,p,c,xmax){
  const k=state.cfg, dv=Math.min(5,Math.max(.05,k.dv||.1)); let n=Math.floor(xmax/dv+1e-9), step=dv;
  if(n>3000){ step=xmax/3000; n=3000; }
  const S=new Set(); for(let i=0;i<=n;i++) S.add(+(i*step).toFixed(9));
  const EQ=c.eqs||[c.Veq]; EQ.forEach(e=>{ if(e<=xmax) S.add(+e.toFixed(9)); }); (c.halves||[]).forEach(e=>{ if(e<=xmax) S.add(+e.toFixed(9)); });
  if(k.refine){ const h=step/10; EQ.forEach(e=>{ for(let j=-10;j<=10;j++){ const v=+(e+j*h).toFixed(9); if(v>=0&&v<=xmax) S.add(v); } }); }
  return Array.from(S).sort((a,b)=>a-b).map(V=>m.calc(p,c,V));
}

  $('#c_dv').addEventListener('input',e=>{ const x=parseFloat(e.target.value); if(Number.isFinite(x)){ k.dv=Math.min(5,Math.max(.05,x)); renderResults(); } });

/* ---- reacción seleccionada y modelo matemático ---- */
const RXN={
  ab:(p,c)=>{
    const T=p.tipo, sp=state.sp.ab||{}, HA=sp.HA||(T===3?'HA':'B'), A=sp.A||(T===3?'A⁻':'BH⁺'), K=Math.pow(10,-p.pK), Kw=Math.pow(10,-p.pKw);
    const kw='H₂O ⇌ H⁺ + OH⁻   Kw = '+fE(Kw)+' (pKw = '+fv(p.pKw)+')';
    const o={1:{re:'H⁺ + OH⁻',pr:'H₂O',d:'Analito: ácido fuerte (H⁺). Titulante: base fuerte (OH⁻).',eqs:[kw]},
      2:{re:'OH⁻ + H⁺',pr:'H₂O',d:'Analito: base fuerte (OH⁻). Titulante: ácido fuerte (H⁺).',eqs:[kw]},
      3:{re:HA+' + OH⁻',pr:A+' + H₂O',d:'Analito: ácido débil '+HA+'. Titulante: base fuerte (OH⁻).',eqs:[HA+' ⇌ H⁺ + '+A+'   Ka = '+fE(K)+' (pKa = '+fN(p.pK,2)+')',kw,A+' + H₂O ⇌ '+HA+' + OH⁻   Kb = Kw/Ka = '+fE(Kw/K)]},
      4:{re:HA+' + H⁺',pr:A,d:'Analito: base débil '+HA+'. Titulante: ácido fuerte (H⁺).',eqs:[HA+' + H₂O ⇌ '+A+' + OH⁻   Kb = '+fE(K)+' (pKb = '+fN(p.pK,2)+')',kw,A+' ⇌ '+HA+' + H⁺   Ka = Kw/Kb = '+fE(Kw/K)]}}[T];
    const ex='Exceso del titulante: ';
    const zA={1:[['Inicio','pH = −log C'],['Antes de Veq','pH = −log([H⁺] sobrante), [H⁺] = n sobrante / V total'],['Equivalencia','pH = pKw/2'],['Después de Veq','pOH = −log([OH⁻] en exceso); pH = pKw − pOH']],
      2:[['Inicio','pOH = −log C; pH = pKw − pOH'],['Antes de Veq','pOH = −log([OH⁻] sobrante); pH = pKw − pOH'],['Equivalencia','pH = pKw/2'],['Después de Veq','pH = −log([H⁺] en exceso)']],
      3:[['Inicio','pH = ½(pKa − log C)'],['Antes de Veq','Henderson: pH = pKa + log(n A⁻ / n HA)'],['Equivalencia','pOH = ½(pKb − log C sal); pKb = pKw − pKa'],['Después de Veq','pOH = −log([OH⁻] en exceso); pH = pKw − pOH']],
      4:[['Inicio','pOH = ½(pKb − log C); pH = pKw − pOH'],['Antes de Veq','pOH = pKb + log(n BH⁺ / n B); pH = pKw − pOH'],['Equivalencia','pH = ½(pKa − log C sal); pKa = pKw − pKb'],['Después de Veq','pH = −log([H⁺] en exceso)']]}[T];
    const zones=p.model===2?[['Todo el recorrido',exactAB(p,0).eq.replace('Exacto — ','Balance de carga: ')+'. [H⁺] se obtiene numéricamente.']]:zA;
    return {re:o.re,pr:o.pr,eq:o.re+' → '+o.pr,desc:o.d,st:'1 : 1. En la equivalencia n(titulante) = n(analito); Veq = Ca·Va/Ct = '+fv(p.Ca)+' × '+fv(p.Va)+' / '+fv(p.Ct)+' = '+fN(c.Veq,3)+' mL.',
      eqs:o.eqs,k:[],zones,model:p.model===2?'EXACTO: balance de carga resuelto numéricamente (incluye autoionización del agua y disociación parcial).':'APROXIMADO por zonas; puede desviarse en soluciones diluidas (usa el modelo exacto para comprobarlo).'};
  },
  edta:(p,c)=>{ const sp=state.sp.edta||{}, M=sp.M||'Mⁿ⁺', MY=sp.MY||'MY^(n−4)', eqs=[M+' + Y⁴⁻ ⇌ '+MY+'   Kf = '+fE(Math.pow(10,p.logKf))+' (log Kf = '+fN(p.logKf,2)+')','H₄Y ⇌ H⁺ + H₃Y⁻ ⇌ … ⇌ Y⁴⁻   Ka1–Ka4 → α(Y⁴⁻) = '+fN(c.a4,4)+' a pH '+fv(p.pH)];
    if(c.aM!==1) eqs.push(M+' + i L ⇌ ML_i   β₁–β₄ → α(M) = '+fv(c.aM));
    return {re:M+' + Y⁴⁻',pr:MY,eq:M+' + Y⁴⁻ → '+MY,desc:'Analito: ion metálico '+M+'. Titulante: EDTA (Y⁴⁻).',st:'1 : 1. Veq = CM·VM/CY = '+fv(p.CM)+' × '+fv(p.VM)+' / '+fv(p.CY)+' = '+fN(c.Veq,3)+' mL.',
      eqs,k:["K′f = Kf·α(Y⁴⁻)/α(M) → log K′f = "+fN(LOG(c.Kc),2)],model:"Modelo condicional por zonas con K′f; pM′ = −log[M′].",
      zones:[['Inicio',"pM′ = −log C_M"],['Antes de Veq',"pM′ = −log([M′] sin reaccionar)"],['Equivalencia',"pM′ = ½(log K′f − log C_MY)"],['Después de Veq',"pM′ = log(K′f · n EDTA exceso / n M)"]]}; },
  pp:(p,c)=>{ const sp=state.sp.pp||{}, X=sp.X||'X⁻', S=(sp.S||'AgX')+'(s)';
    return {re:'Ag⁺ + '+X,pr:S,eq:'Ag⁺ + '+X+' → '+S,desc:'Analito: haluro o pseudohaluro '+X+'. Titulante: AgNO₃ (Ag⁺).',st:'1 : 1. Veq = C·V/Ct = '+fv(p.C)+' × '+fv(p.V)+' / '+fv(p.Ct)+' = '+fN(c.Veq,3)+' mL.',
      eqs:[S+' ⇌ Ag⁺ + '+X+'   Kps = '+fE(p.Kps)+' (pKps = '+fN(c.pKps,2)+')'],k:[],model:'Modelo por zonas basado en el balance de materia y en Kps.',
      zones:[['Inicio','pX = −log C'],['Antes de Veq','pX = −log([X⁻] sin reaccionar)'],['Equivalencia','pX = ½ pKps'],['Después de Veq','pAg = −log([Ag⁺] en exceso); pX = pKps − pAg']]}; },
  poly:(p,c)=>{
    const n=p.n, sp=state.sp.poly||{}, S=sp.S||Array.from({length:n+1},(_,i)=>polyName(n,i)), pKs=polyKs(p), Kw=Math.pow(10,-p.pKw);
    const stages=[]; for(let j=1;j<=n;j++) stages.push([S[j-1]+' + OH⁻',S[j]+' + H₂O']);
    const eqs=[]; for(let j=1;j<=n;j++) eqs.push(S[j-1]+' ⇌ H⁺ + '+S[j]+'   Ka'+SUB[j]+' = '+fE(Math.pow(10,-pKs[j-1]))+' (pKa'+SUB[j]+' = '+fN(pKs[j-1],2)+')');
    eqs.push('H₂O ⇌ H⁺ + OH⁻   Kw = '+fE(Kw)+' (pKw = '+fv(p.pKw)+')');
    eqs.push(S[n]+' + H₂O ⇌ '+S[n-1]+' + OH⁻   Kb = Kw/Ka'+SUB[n]+' = '+fE(Kw/Math.pow(10,-pKs[n-1])));
    const half=['½','3/2','5/2'], k=[]; for(let j=1;j<=n;j++) k.push('En '+half[j-1]+' Veq₁ ('+fN(c.halves[j-1],2)+' mL): n '+S[j]+' = n '+S[j-1]+' → pH = pKa'+SUB[j]+' = '+fN(pKs[j-1],2));
    const z=[['Inicio','pH = ½(pKa₁ − log C)']];
    for(let j=1;j<=n;j++){ z.push(['Buffer '+j+' ('+S[j-1]+' / '+S[j]+')','Henderson: pH = pKa'+SUB[j]+' + log(n '+S[j]+' / n '+S[j-1]+')']);
      z.push(['Equivalencia '+j+' (Veq'+SUB[j]+')',j<n?'Anfolito: pH = ½(pKa'+SUB[j]+' + pKa'+SUB[j+1]+')':'pOH = ½(pKb − log C sal); pKb = pKw − pKa'+SUB[n]]); }
    z.push(['Después de Veq'+SUB[n],'pOH = −log([OH⁻] en exceso); pH = pKw − pOH']);

/* ---- análisis de datos experimentales ---- */
function checkRows(rows,kind){
  const w=[]; let bad=0, uns=false, dup=false, prev=null; const seen=new Set();
  rows.forEach(r=>{ const a=parseFloat(String(r[0]).replace(',','.')), b=parseFloat(String(r[1]).replace(',','.'));
    if(String(r[0]).trim()===''&&String(r[1]).trim()==='') return;
    if(!Number.isFinite(a)||!Number.isFinite(b)){ bad++; return; }
    if(a<0) w.push('Hay volúmenes negativos.'); if(prev!=null&&a<prev) uns=true; if(seen.has(a)) dup=true; seen.add(a); prev=a;
    if(kind==='pH'&&(b<0||b>14)) w.push('Hay valores de pH fuera de 0–14: revisa si son mV u otra lectura.'); });
  if(bad) w.unshift(bad+' fila(s) incompletas o no numéricas se omiten.');
  if(uns) w.push('Los volúmenes no están en orden creciente: se ordenan automáticamente.');
  if(dup) w.push('Hay volúmenes repetidos: se conserva la primera lectura.');
  return Array.from(new Set(w));
}
function analyzeData(){
  const pts=parseData(state.data.rows.map(r=>r[0]+'\t'+r[1]).join('\n'));
  if(pts.length<4) return {pts,D:null};
  const D=derivs(pts); let th=null, rms=null; const pa=state.p.ab;
  if(state.data.kind==='pH'&&Object.keys(pa).every(k=>Number.isFinite(pa[k]))&&!AB.validate(pa)){ const c=AB.prep(pa); th={pa,c,at:V=>AB.calc(pa,c,V).y};
    rms=Math.sqrt(pts.reduce((a,r)=>a+Math.pow(r[1]-th.at(r[0]),2),0)/pts.length); }
  return {pts,D,th,rms};
}

function svgToPng(svg){
  return new Promise((res,rej)=>{
    const L={'--surface':'#ffffff','--ink':'#1d1d1f','--muted':'#707070','--grid':'#e6e6e8','--grid-minor':'#f5f5f7','--curve':'#1d1d1f','--accent':'#0066cc','--teal':'#86868b','--exp':'#b64400','--line':'#d6d6d6'};
    const W=+svg.getAttribute('width'), H=+svg.getAttribute('height');
    let x=new XMLSerializer().serializeToString(svg).replace(/var\((--[\w-]+)\)/g,(m,n)=>L[n]||'#000');
    x=x.replace('<defs>','<style>text{font-family:Arial,sans-serif}.ax text{fill:#707070;font-size:11px}.axt{fill:#1d1d1f;font-size:12px;font-weight:600}</style><defs>');
    const img=new Image(), t=setTimeout(()=>rej(new Error('timeout')),3000);
    img.onload=()=>{ clearTimeout(t); const cv=document.createElement('canvas'); cv.width=W*2; cv.height=H*2; const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.scale(2,2); g.drawImage(img,0,0); res({url:cv.toDataURL('image/png'),W,H}); };
    img.onerror=()=>{ clearTimeout(t); rej(new Error('img')); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x);
  });
}

    addD('Veq','Volumen de equivalencia Veq = n₀ / C_EDTA',R.n0+'/'+R.CY+'*1000',c.Veq,'mL');
    addD('H','[H⁺] = 10^(−pH)','10^(-'+R.pH+')',c.H,'mol/L');
    const H=R.H;
    addD('a4','α(Y⁴⁻) a ese pH',R.Ka1+'*'+R.Ka2+'*'+R.Ka3+'*'+R.Ka4+'/('+H+'^4+'+R.Ka1+'*'+H+'^3+'+R.Ka1+'*'+R.Ka2+'*'+H+'^2+'+R.Ka1+'*'+R.Ka2+'*'+R.Ka3+'*'+H+'+'+R.Ka1+'*'+R.Ka2+'*'+R.Ka3+'*'+R.Ka4+')',c.a4,'');
    addD('aM','α(M) por complejante auxiliar','1+'+R.b1+'*'+R.L+'+'+R.b2+'*'+R.L+'^2+'+R.b3+'*'+R.L+'^3+'+R.b4+'*'+R.L+'^4',c.aM,'');
    addD('Kc',"K′f condicional = Kf·α(Y⁴⁻)/α(M)",'10^'+R.logKf+'*'+R.a4+'/'+R.aM,c.Kc,'');
  } else if(m.key==='pp'){
    addD('n0','Moles iniciales de X⁻ n₀ = C·V',R.C+'*'+R.V+'/1000',c.n0,'mol');
    addD('Veq','Volumen de equivalencia Veq = n₀ / Ct',R.n0+'/'+R.Ct+'*1000',c.Veq,'mL');
    addD('pKps','pKps = −log Kps','-LOG10('+R.Kps+')',c.pKps,'');
  } else if(m.key==='rx'){
    addD('n0','Moles iniciales de analito n₀ = C·V',R.C+'*'+R.V+'/1000',c.n0,'mol');
    addD('s','2.303RT/F','LN(10)*8.314462*(273.15+'+R.T+')/96485.33',c.s,'V');
    addD('Veq','Volumen de equivalencia Veq = (n₁/n₂)·n₀ / Ct','('+R.n1+'/'+R.n2+')*'+R.n0+'/'+R.Ct+'*1000',c.Veq,'mL');
    addD('Eeq','E en el equivalente (vs ESH)','('+R.n1+'*'+R.E1+'+'+R.n2+'*'+R.E2+')/('+R.n1+'+'+R.n2+')',c.Eeq,'V');
  }
}
/* columnas de la hoja Cálculos: cada una con fórmula de Excel (f) y valor en caché (v) */
function xlSpec(m,p,c,ref,ex){
  const R=ref, q=s=>'"'+s+'"', P=(k,h,f,v,fmt,tag)=>({k,h,f,v,fmt,tag});
  const base=P('V','V de titulante (mL)',null,r=>r.V,'0.00',false);
  const Zf=(L,n,a,b,e,d)=>{ const V=L.V+n; return 'IF('+V+'=0,'+a+',IF(ABS('+V+'-'+R.Veq+')<0.000001,'+e+',IF('+V+'<'+R.Veq+','+b+','+d+')))'; };
  const hasEx=p.model===2&&(m.key==='ab'||m.key==='poly');
  let cols, ykey, ylab;
  if(m.key==='ab'){
    const T=p.tipo, an=['H⁺','OH⁻','HA','B'][T-1], ti=(T===1||T===3)?'OH⁻':'H⁺', fo=T===3?'A⁻':'BH⁺';
    const zn=['Inicio',T>=3?'Zona buffer':'Antes del equivalente','Equivalencia','Después del equivalente'];
    cols=[base,
      P('nt','n '+ti+' agregado (mol)',(n,L)=>R.Ct+'*'+L.V+n+'/1000',r=>r.nt,XE),
      P('vt','V total (L)',(n,L)=>'('+R.Va+'+'+L.V+n+')/1000',r=>r.vt,'0.0000'),
      P('nr','n '+an+' sin reaccionar (mol)',(n,L)=>'MAX('+R.n0+'-'+L.nt+n+',0)',r=>r.nr,XE),
      P('ne','n '+ti+' en exceso (mol)',(n,L)=>'MAX('+L.nt+n+'-'+R.n0+',0)',r=>r.ne,XE)];
    if(T>=3) cols.push(P('nf','n '+fo+' formado (mol)',(n,L)=>'MIN('+L.nt+n+','+R.n0+')',r=>Math.min(r.nt,c.n0),XE));
    cols.push(P('cr','['+an+'] sin reaccionar (mol/L)',(n,L)=>L.nr+n+'/'+L.vt+n,r=>r.nr/r.vt,XE));
    if(T>=3) cols.push(P('cf','['+fo+'] formado (mol/L)',(n,L)=>L.nf+n+'/'+L.vt+n,r=>Math.min(r.nt,c.n0)/r.vt,XE));
    cols.push(P('ce','['+ti+'] en exceso (mol/L)',(n,L)=>L.ne+n+'/'+L.vt+n,r=>r.ne/r.vt,XE));
    cols.push(P('zona','Zona',(n,L)=>Zf(L,n,q(zn[0]),q(zn[1]),q(zn[2]),q(zn[3])),r=>r.zoneName));
    cols.push(P('pH',hasEx?'pH por zonas':'pH',(n,L)=>{ const g=k=>L[k]+n;
      if(T===1) return Zf(L,n,'-LOG10('+R.Ca+')','-LOG10('+g('cr')+')',R.pKw+'/2',R.pKw+'+LOG10('+g('ce')+')');
      if(T===2) return Zf(L,n,R.pKw+'+LOG10('+R.Ca+')',R.pKw+'+LOG10('+g('cr')+')',R.pKw+'/2','-LOG10('+g('ce')+')');
      if(T===3) return Zf(L,n,'0.5*('+R.pK+'-LOG10('+R.Ca+'))',R.pK+'+LOG10('+g('nf')+'/'+g('nr')+')',R.pKw+'-0.5*(('+R.pKw+'-'+R.pK+')-LOG10('+R.n0+'/'+g('vt')+'))',R.pKw+'+LOG10('+g('ce')+')');
      return Zf(L,n,R.pKw+'-0.5*('+R.pK+'-LOG10('+R.Ca+'))',R.pKw+'-('+R.pK+'+LOG10('+g('nf')+'/'+g('nr')+'))','0.5*(('+R.pKw+'-'+R.pK+')-LOG10('+R.n0+'/'+g('vt')+'))','-LOG10('+g('ce')+')'); },r=>r.y,'0.00'));
    cols.push(P('pOH','pOH',(n,L)=>R.pKw+'-'+L.pH+n,r=>p.pKw-r.y,'0.00'));
    ykey='pH'; ylab='pH';
  } else if(m.key==='poly'){
    const pk=['pK1','pK2','pK3'].slice(0,p.n).map(k=>R[k]).join(',');
    cols=[base,
      P('nt','n OH⁻ agregado (mol)',(n,L)=>R.Ct+'*'+L.V+n+'/1000',r=>r.nt,XE),
      P('vt','V total (L)',(n,L)=>'('+R.Va+'+'+L.V+n+')/1000',r=>r.vt,'0.0000'),
      P('nu','Equivalentes agregados ν = n OH⁻ / n₀',(n,L)=>L.nt+n+'/'+R.n0,r=>r.nu,'0.000'),
      P('ne','n OH⁻ en exceso (mol)',(n,L)=>'MAX('+L.nt+n+'-'+R.n+'*'+R.n0+',0)',r=>r.ne,XE),
      P('ce','[OH⁻] en exceso (mol/L)',(n,L)=>L.ne+n+'/'+L.vt+n,r=>r.ne/r.vt,XE),
      P('nA','n forma ácida del par buffer (mol)',(n,L)=>'IF(LEFT('+L.zona+n+',6)="Buffer",(INT('+L.nu+n+')+1)*'+R.n0+'-'+L.nt+n+',"")',r=>r.z===1?(Math.floor(r.nu)+1)*c.n0-r.nt:'',XE),
      P('nB','n forma básica del par buffer (mol)',(n,L)=>'IF(LEFT('+L.zona+n+',6)="Buffer",'+L.nt+n+'-INT('+L.nu+n+')*'+R.n0+',"")',r=>r.z===1?r.nt-Math.floor(r.nu)*c.n0:'',XE),
      P('zona','Zona',(n,L)=>{ const nu=L.nu+n, a=L.V+n; return 'IF('+a+'=0,"Inicio",IF(AND(ROUND('+nu+',0)>=1,ROUND('+nu+',0)<='+R.n+',ABS('+a+'-ROUND('+nu+',0)*'+R.Veq1+')<0.000001),"Equivalencia "&ROUND('+nu+',0),IF('+nu+'>'+R.n+',"Después de la equivalencia "&'+R.n+',"Buffer "&(INT('+nu+')+1))))'; },
        r=>r.z===0?'Inicio':r.z===1?'Buffer '+(Math.floor(r.nu)+1):r.z===2?'Equivalencia '+Math.round(r.nu):'Después de la equivalencia '+p.n),
      P('pH',hasEx?'pH por zonas':'pH',(n,L)=>{ const Z=L.zona+n, nu=L.nu+n, j='ROUND('+nu+',0)';
        return 'IF('+Z+'="Inicio",0.5*('+R.pK1+'-LOG10('+R.Ca+')),IF(LEFT('+Z+',6)="Buffer",CHOOSE(INT('+nu+')+1,'+pk+')+LOG10('+L.nB+n+'/'+L.nA+n+'),IF(LEFT('+Z+',12)="Equivalencia",IF('+j+'<'+R.n+',0.5*(CHOOSE('+j+','+pk+')+CHOOSE('+j+'+1,'+pk+')),'+R.pKw+'-0.5*(('+R.pKw+'-CHOOSE('+R.n+','+pk+'))-LOG10('+R.n0+'/'+L.vt+n+'))),'+R.pKw+'+LOG10('+L.ce+n+'))))'; },r=>r.y,'0.00'),
      P('pOH','pOH',(n,L)=>R.pKw+'-'+L.pH+n,r=>p.pKw-r.y,'0.00')];
    ykey='pH'; ylab='pH';
  } else if(m.key==='edta'){
    const zn=['Inicio','Antes del eq. (metal en exceso)','Equivalencia (disociación de MY)','Después del eq. (EDTA en exceso)'];
    cols=[base,
      P('nt','n EDTA agregado (mol)',(n,L)=>R.CY+'*'+L.V+n+'/1000',r=>r.nt,XE),
      P('vt','V total (L)',(n,L)=>'('+R.VM+'+'+L.V+n+')/1000',r=>r.vt,'0.0000'),
      P('nr','n metal sin reaccionar (mol)',(n,L)=>'MAX('+R.n0+'-'+L.nt+n+',0)',r=>r.nr,XE),
      P('ne','n EDTA en exceso (mol)',(n,L)=>'MAX('+L.nt+n+'-'+R.n0+',0)',r=>r.ne,XE),
      P('cr',"[M′] sin reaccionar (mol/L)",(n,L)=>L.nr+n+'/'+L.vt+n,r=>r.nr/r.vt,XE),
      P('ce','[EDTA] en exceso (mol/L)',(n,L)=>L.ne+n+'/'+L.vt+n,r=>r.ne/r.vt,XE),
      P('zona','Zona',(n,L)=>Zf(L,n,q(zn[0]),q(zn[1]),q(zn[2]),q(zn[3])),r=>r.zoneName),
      P('pM',"pM'",(n,L)=>Zf(L,n,'-LOG10('+R.CM+')','-LOG10('+L.cr+n+')','0.5*(LOG10('+R.Kc+')-LOG10('+R.n0+'/'+L.vt+n+'))','LOG10('+R.Kc+'*'+L.ne+n+'/'+R.n0+')'),r=>r.y,'0.00'),
      P('pML','pM libre',(n,L)=>L.pM+n+'+LOG10('+R.aM+')',r=>r.y2,'0.00')];
    ykey='pM'; ylab="pM'";
  } else if(m.key==='pp'){
    const zn=['Inicio','Antes del equivalente','Equivalencia','Después del equivalente'];
    cols=[base,
      P('nt','n Ag⁺ agregado (mol)',(n,L)=>R.Ct+'*'+L.V+n+'/1000',r=>r.nt,XE),
      P('vt','V total (L)',(n,L)=>'('+R.V+'+'+L.V+n+')/1000',r=>r.vt,'0.0000'),
      P('nr','n X⁻ sin reaccionar (mol)',(n,L)=>'MAX('+R.n0+'-'+L.nt+n+',0)',r=>r.nr,XE),
      P('ne','n Ag⁺ en exceso (mol)',(n,L)=>'MAX('+L.nt+n+'-'+R.n0+',0)',r=>r.ne,XE),
      P('cr','[X⁻] sin reaccionar (mol/L)',(n,L)=>L.nr+n+'/'+L.vt+n,r=>r.nr/r.vt,XE),
      P('ce','[Ag⁺] en exceso (mol/L)',(n,L)=>L.ne+n+'/'+L.vt+n,r=>r.ne/r.vt,XE),
      P('zona','Zona',(n,L)=>Zf(L,n,q(zn[0]),q(zn[1]),q(zn[2]),q(zn[3])),r=>r.zoneName),
      P('pX','pX',(n,L)=>Zf(L,n,'-LOG10('+R.C+')','-LOG10('+L.cr+n+')',R.pKps+'/2',R.pKps+'+LOG10('+L.ce+n+')'),r=>r.y,'0.00'),
      P('pAg','pAg',(n,L)=>R.pKps+'-'+L.pX+n,r=>r.y2,'0.00')];
    ykey='pX'; ylab='pX';
  } else {
    const zn=['Inicio','Antes del equivalente','Equivalencia','Después del equivalente'], nd='"n.d."';
    cols=[base,
      P('nt','n oxidante agregado (mol)',(n,L)=>R.Ct+'*'+L.V+n+'/1000',r=>r.nt,XE),
      P('o1','n Ox₁ formado (mol)',(n,L)=>'MIN('+R.n0+','+L.nt+n+'*'+R.n2+'/'+R.n1+')',r=>r.nOx1,XE),
      P('r1','n Red₁ restante (mol)',(n,L)=>'MAX('+R.n0+'-'+L.nt+n+'*'+R.n2+'/'+R.n1+',0)',r=>r.nRed1,XE),
      P('o2','n Ox₂ en exceso (mol)',(n,L)=>'MAX('+L.nt+n+'-'+R.n0+'*'+R.n1+'/'+R.n2+',0)',r=>r.nOx2,XE),
      P('r2','n Red₂ formado (mol)',(n,L)=>'MIN('+L.nt+n+','+R.n0+'*'+R.n1+'/'+R.n2+')',r=>r.nRed2,XE),
      P('zona','Zona',(n,L)=>Zf(L,n,q(zn[0]),q(zn[1]),q(zn[2]),q(zn[3])),r=>r.zoneName),
      P('Ee','E vs ESH (V)',(n,L)=>Zf(L,n,nd,R.E1+'+'+R.s+'/'+R.n1+'*LOG10('+L.o1+n+'/'+L.r1+n+')',R.Eeq,R.E2+'+'+R.s+'/'+R.n2+'*LOG10('+L.o2+n+'/'+L.r2+n+')'),r=>r.y2==null?'n.d.':r.y2,'0.000'),
      P('Er','E vs referencia (V)',(n,L)=>'IF(ISNUMBER('+L.Ee+n+'),'+L.Ee+n+'-'+R.Eref+','+nd+')',r=>r.y==null?'n.d.':r.y,'0.000')];
    ykey='Er'; ylab='E vs referencia (V)';
  }
  if(hasEx){
    const resF=(n,L)=>{ const h=L.hex+n, Vv=L.V+n, a=R.Ca+'*'+R.Va+'/('+R.Va+'+'+Vv+')', t=R.Ct+'*'+Vv+'/('+R.Va+'+'+Vv+')', Kw='10^(-'+R.pKw+')';
      if(m.key==='ab'){ const T=p.tipo, Ka=T===3?'10^(-'+R.pK+')':'10^(-('+R.pKw+'-'+R.pK+'))';
        return T===1?h+'+'+t+'-'+a+'-'+Kw+'/'+h:T===2?h+'+'+a+'-'+t+'-'+Kw+'/'+h:T===3?h+'+'+t+'-'+Kw+'/'+h+'-'+a+'*'+Ka+'/('+Ka+'+'+h+')':h+'+'+a+'*'+h+'/('+Ka+'+'+h+')-'+t+'-'+Kw+'/'+h; }
      const nn=p.n, Ks=[]; for(let i=1;i<=nn;i++) Ks.push('10^(-'+R['pK'+i]+')');
      const Tm=[]; for(let i=0;i<=nn;i++){ let pr=''; for(let k=0;k<i;k++) pr+=Ks[k]+'*'; Tm.push(pr+h+'^'+(nn-i)); }
      const num=Tm.map((x,i)=>i===0?null:i+'*'+x).filter(Boolean).join('+');
      return t+'+'+h+'-'+Kw+'/'+h+'-'+a+'*('+num+')/('+Tm.join('+')+')'; };
    const resV=(r,i)=>{ const V=r.V, vtm=p.Va+V, a=p.Ca*p.Va/vtm, t=p.Ct*V/vtm, Kw=Math.pow(10,-p.pKw), h=Math.pow(10,-ex[i].y);
      if(m.key==='ab'){ const T=p.tipo, Ka=T===3?Math.pow(10,-p.pK):Math.pow(10,-(p.pKw-p.pK)); return T===1?h+t-a-Kw/h:T===2?h+a-t-Kw/h:T===3?h+t-Kw/h-a*Ka/(Ka+h):h+a*h/(Ka+h)-t-Kw/h; }
      const nn=p.n, Ks=polyKs(p).map(x=>Math.pow(10,-x)), Tm=[Math.pow(h,nn)]; let pr=1; for(let i=1;i<=nn;i++){ pr*=Ks[i-1]; Tm.push(pr*Math.pow(h,nn-i)); }
      const D=Tm.reduce((u,x)=>u+x,0); let q=0; for(let i=1;i<=nn;i++) q+=i*Tm[i]/D; return t+h-Kw/h-a*q; };
    cols.push(P('pHex','pH exacto (balance de carga)',null,(r,i)=>ex[i].y,'0.00'));
    cols.push(P('hex','[H⁺] exacto (mol/L) = 10^(−pH exacto)',(n,L)=>'10^(-'+L.pHex+n+')',(r,i)=>Math.pow(10,-ex[i].y),XE));
    cols.push(P('res','Residuo del balance de carga (mol/L): verificación',resF,resV,XE));
    cols.push(P('dif','Exacto − por zonas',(n,L)=>L.pHex+n+'-'+L.pH+n,(r,i)=>ex[i].y-r.y,'0.00'));
  }
  const yv=cols.filter(x=>x.k===ykey)[0].v;
  cols.push(P('gx','V (mL) para graficar',(n,L)=>L.V+n,r=>r.V,'0.00'));
  cols.push(P('gy',ylab+' para graficar',(n,L)=>'IF(ISNUMBER('+L[ykey]+n+'),'+L[ykey]+n+',NA())',(r,i)=>{ const v=yv(r,i); return typeof v==='number'?v:'#N/A'; },'0.00'));
  return {cols,ykey,ylab};
}

function procRows(d){
  const R=[]; d.pre.forEach(t=>R.push(['','Datos de partida',t])); d.intro.forEach(t=>R.push(['','Introducción',t]));
  d.regEx.forEach(e=>{ R.push(['B. Ejemplo: '+e.n+' (V = '+fN(e.V,3)+' mL)','Ecuación',e.eq]); e.steps.forEach(s=>R.push(['','Operación',s])); if(e.y!=null) R.push(['','Resultado',e.lbl+' = '+fN(e.y,3)]); });
  if(d.exact){ R.push(['B. Modelo exacto','Ecuación',d.exact.eq]); d.exact.steps.forEach(s=>R.push(['','Operación',s])); }
  d.cols.forEach(cl=>{ const A=cl.A,B=cl.B,C=cl.C;
    R.push([cl.name,'B1. Qué representa',A.quim]); R.push(['','B2. Datos iniciales',A.datos]); R.push(['','B3. Ecuación',A.eq]); (A.simb||[]).forEach(s=>R.push(['','      símbolo',s]));
    R.push(['','B4. Por qué se usa',A.porque]); (A.sust||[]).forEach(s=>R.push(['','B5. Sustitución',s])); R.push(['','B6. Unidades y redondeo',A.unid+'. '+(A.redo||'')]); R.push(['','B7. Ejemplo numérico',A.ejemplo]);
    R.push(['','C1. Origen químico y matemático',C.origen]); R.push(['','C2. Datos que necesita',C.datos]); R.push(['','C3. Operaciones',C.ops||'—']); R.push(['','C4. Relación con otras columnas',C.rel]);
    R.push(['','D1. Operación en Excel',B.xlop||'—']); if(B.formula) R.push(['','D2. Fórmula exacta (fila '+d.row+')',B.formula]); (B.deps||[]).forEach(s=>R.push(['','D3. Celdas de entrada',s]));
    (B.xlex||[]).forEach(s=>R.push(['','D4. Qué hace cada parte',s])); if(B.copiar) R.push(['','D5. Cómo copiarla',B.copiar]); if(B.quesi) R.push(['','D6. Si cambias un dato',B.quesi]); });
  d.limits.forEach(t=>R.push(['Limitaciones','',t])); return R;
}
function fundRows(d){
  const F=d.fund, R=[];
  F.principio.forEach(x=>R.push(['A1. Principio químico (respaldado por la referencia)','Fundamento',x.t+(x.ch.length?' '+citeTxt(x.ch):'')]));
  R.push(['','Estequiometría',F.estequiometria]); F.reacciones.forEach(t=>R.push(['Reacciones y equilibrios','',t]));
  F.gloss.forEach(g=>R.push(['Variables y constantes','Símbolo',g[0]+': '+g[1]])); F.vars.forEach(v=>R.push(['','Valor actual',v[0]+' = '+v[1]+' ('+v[2]+')']));
  R.push(['A2. Implementación en el código (no respaldada por el libro)','Modelo',F.modelo]);
  d.regions.forEach(z=>{ R.push(['Región: '+z.n,'Ecuación',z.eq]); R.push(['','Por qué',z.why]); });
  F.supuestos.forEach(t=>R.push(['Supuestos y aproximaciones','',t])); F.dif.forEach(t=>R.push(['Diferencias con la formulación teórica','',t]));
  R.push(['Bibliografía','Referencia principal',BIBLIO.main]); BIBLIO.notas.forEach(t=>R.push(['','Estado de verificación',t]));
  return R;
}

      put(4,'Veq 2ª derivada (mL) [JS]',Dd.veq2==null?'n.d.':Dd.veq2);

      put(9,'Método 1ª derivada','Máximo de |ΔY/ΔV|; Veq = punto medio del intervalo.'); put(10,'Método 2ª derivada','Cruce por cero de Δ²Y/ΔV², interpolación lineal.');
      for(let j=1;j<=4;j++) w5.getColumn(j).width=26; w5.getColumn(6).width=40; w5.getColumn(7).width=28; }
    /* 7. Imagen de la gráfica (respaldo) */
    let imgNote='';
    try{ const sv=document.querySelector('.plot svg'); if(sv){ const im=await svgToPng(sv); const id=wb.addImage({base64:im.url,extension:'png'}); const w6=wb.addWorksheet('Gráfica (imagen)');
      w6.addRow(['Imagen de la gráfica mostrada en la aplicación. La gráfica nativa y editable está en la hoja «Resumen».']); w6.getColumn(1).width=60; w6.addImage(id,{tl:{col:0,row:2},ext:{width:im.W,height:im.H}}); } }
    catch(e2){ imgNote=' (la imagen de la gráfica no pudo generarse)'; }
    let buf=await wb.xlsx.writeBuffer(), chartNote='';
    try{ if(typeof JSZip==='undefined') throw new Error('sin JSZip');
      buf=await addNativeChart(buf,{sheetId:w0.id,sheetName:'Cálculos',nRows:ptsX.length+1,xCol:XL.gx,yCol:XL.gy,simCol:XL.gs,title:'Curva de titulación · '+m.tab,xTitle:m.key==='edta'?'Volumen de EDTA (mL)':m.key==='pp'?'Volumen de AgNO₃ (mL)':'Volumen de titulante (mL)',yTitle:SP.ylab,anchorCol:4,anchorRow:3,ymin:m.ymin,ymax:m.ymax});
    }catch(e3){ console.error(e3); chartNote=' (la gráfica nativa no pudo generarse; queda la imagen)'; }
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='curva-titulacion-'+m.key+'.xlsx'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Excel generado'+imgNote+chartNote+'.');
  }catch(err){ console.error(err); toast('No se pudo generar el Excel: '+err.message); }
}

buildMainNav(); buildTabs(); mount();
})();
